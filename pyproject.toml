[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
# Glue 5.0 runs Python 3.11; local tooling targets the same version so that
# syntax accepted locally is syntax the job will accept in AWS.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "B023",  # loop-variable closures are deliberate in the defect injector
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
