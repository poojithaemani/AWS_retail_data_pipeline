[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
# Glue 5.0 runs Python 3.11; local tooling targets the same version so that
# syntax accepted locally is syntax the job will accept in AWS.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "B023",  # loop-variable closures are deliberate in the defect injector
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.pyright]
# src/ is not a Python package yet - there is no __init__.py anywhere - so
# three modules reach their imports through sys.path.insert at runtime:
#
#   scripts/partition_experiments.py   imports generate_retail_data
#   src/generate/generate_retail_data.py  imports vocab
#   tests/test_generate.py             imports the generator
#
# Those imports work. No static analyser follows a runtime sys.path change,
# though, so the editor reports them as unresolved. These search paths tell it
# where to look, which removes a warning that was never a defect.
#
# This is a stopgap. The real fix is D17 in docs/decisions.md: collapse src/
# into an importable package so nothing needs to touch sys.path. That is due
# before Phase 3, when src/transform/ starts importing src/common/ and Glue
# needs one obvious thing to zip for --extra-py-files.
extraPaths = ["src", "src/generate", "scripts"]
